# Lock Down An Open Perses Server
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-106-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm 3.22.1, percli v0.54.0, Prometheus, the tester pod and Perses v0.54.0 (chart 0.23.3)"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-106-capstone-030-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus and the tester pod (namespace observability)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses answers from the tester pod"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-auth-on"
      description: "Confirms anonymous requests are refused"
      type: "file"
      source: "validation/validate-auth-on.sh"
    - name: "validate-sign-up-off"
      description: "Confirms an anonymous visitor cannot create a user"
      type: "file"
      source: "validation/validate-sign-up-off.sh"
    - name: "validate-no-global-binding"
      description: "Confirms no GlobalRoleBinding gives dana access"
      type: "file"
      source: "validation/validate-no-global-binding.sh"
    - name: "validate-dana-edits-inventory"
      description: "Confirms dana can create a dashboard in inventory"
      type: "file"
      source: "validation/validate-dana-edits-inventory.sh"
    - name: "validate-dana-not-billing"
      description: "Confirms dana cannot create a dashboard in billing"
      type: "file"
      source: "validation/validate-dana-not-billing.sh"

teardown:
  keepCluster: false
